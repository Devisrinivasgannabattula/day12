spring.application.name=taskforge
server.port=8080

# Oracle 21c
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/orcl
spring.datasource.username=SYSTEM
spring.datasource.password=123456
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# JWT - development secret only. Change for any real deployment.
taskforge.jwt.secret=TaskForgeSuperSecretKeyForDevelopmentOnlyChangeThisKey12345678901234567890
taskforge.jwt.expiration=86400000

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.taskforge=DEBUG
